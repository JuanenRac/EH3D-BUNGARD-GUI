name: Release binaries

# Builds the program for Windows (64 and 32 bits), Linux and macOS (Apple silicon and Intel) and keeps the packages as artifacts of the run.
# The release itself is published from the maintainer's machine, which downloads these artifacts, so that the notes and the assets
# of every repository of the ecosystem are made the same way. Run it by hand: Actions > Release binaries > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu, ext: "", archive: tar.gz }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc, ext: ".exe", archive: zip }
          - { os: windows-latest, label: windows-x86, target: i686-pc-windows-msvc, ext: ".exe", archive: zip }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin, ext: "", archive: tar.gz }
          - { os: macos-latest, label: macos-x86_64, target: x86_64-apple-darwin, ext: "", archive: tar.gz }
    steps:
      - uses: actions/checkout@v5
        with:
          path: EH3D-BUNGARD-GUI
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-COMMON
          path: EH3D-COMMON
      - name: Check out the sibling EH3D-DRILLPRO (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-DRILLPRO
          path: EH3D-DRILLPRO
      - name: Check out the sibling EH3D-ROUTEPRO (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-ROUTEPRO
          path: EH3D-ROUTEPRO
      - name: Linux libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --features gui --target ${{ matrix.target }}
        working-directory: EH3D-BUNGARD-GUI
      - name: Package
        shell: bash
        working-directory: EH3D-BUNGARD-GUI
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('eh3d.project.json'))['version'])")
          name="bungard-gui-${version}-${{ matrix.label }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bungard-gui${{ matrix.ext }}" "$name/"
          cp LICENSE README.md CHANGELOG.md "$name/"
          # the test files and the sample machine and tool files, as examples
          cp -r testdata "$name/examples"
          cp -r voices "$name/voices"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "dist/${name}.zip" "$name" >/dev/null
            asset="dist/${name}.zip"
          else
            tar -czf "dist/${name}.tar.gz" "$name"
            asset="dist/${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" | sed 's#dist/##' > "${asset}.sha256"; else shasum -a 256 "$asset" | sed 's#dist/##' > "${asset}.sha256"; fi
          cat "${asset}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bungard-gui-${{ matrix.label }}
          path: EH3D-BUNGARD-GUI/dist/*
          if-no-files-found: error
