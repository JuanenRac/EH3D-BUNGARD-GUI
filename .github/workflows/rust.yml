name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-BUNGARD-GUI
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-COMMON
          ref: v0.2.1
          path: EH3D-COMMON
      - name: Check out the sibling EH3D-DRILLPRO (a path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-DRILLPRO
          ref: v0.1.7
          path: EH3D-DRILLPRO
      - name: Check out the sibling EH3D-ROUTEPRO (a path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-ROUTEPRO
          ref: v0.1.6
          path: EH3D-ROUTEPRO
      - name: Linux libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-BUNGARD-GUI
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: EH3D-BUNGARD-GUI
      - name: Format
        run: cargo fmt --all --check
        working-directory: EH3D-BUNGARD-GUI
      - name: Lints
        run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: EH3D-BUNGARD-GUI
      - name: Tests
        run: cargo test --all-targets --features gui
        working-directory: EH3D-BUNGARD-GUI
