[package]
name = "eh3d-bungard-gui"
version = "0.1.0"
edition = "2021"
description = "The modern interface for the Bungard machines: launcher, 2D and 3D view of the job, drilling and routing together"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-BUNGARD-GUI"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe", "dep:png", "dep:jpeg-decoder"]

[dependencies]
eh3d-view = { path = "../EH3D-COMMON/crates/view" }
eh3d-archive = { path = "../EH3D-COMMON/crates/archive" }
eh3d-bungard-formats = { path = "../EH3D-COMMON/crates/formats" }
eh3d-fleet = { path = "../EH3D-COMMON/crates/fleet" }
eh3d-levelling = { path = "../EH3D-COMMON/crates/levelling" }
eh3d-aux = { path = "../EH3D-COMMON/crates/auxnode" }
eh3d-inspect = { path = "../EH3D-COMMON/crates/inspect" }
serde_json = "1"
eh3d-drillpro = { path = "../EH3D-DRILLPRO" }
eh3d-routepro = { path = "../EH3D-ROUTEPRO" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", default-features = false, optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[[bin]]
name = "bungard-gui"
path = "src/bin/bungard_gui.rs"
required-features = ["gui"]

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"

[dev-dependencies]
# the test draws a board and sends it as the camera of the node would
jpeg-encoder = "0.6"
