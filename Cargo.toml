[package]
name = "eh3d-bungard-gui"
version = "0.2.6"
edition = "2021"
description = "The modern interface for the Bungard machines: launcher, 2D and 3D view of the job, drilling and routing together"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-BUNGARD-GUI"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe", "dep:png", "dep:jpeg-decoder", "dep:arboard", "updates"]
# the update from the releases of GitHub: its own TLS (rustls with the ring provider and the roots of webpki, no system library), SHA-256 and the two archive formats
updates = ["dep:ureq", "dep:sha2", "dep:flate2", "dep:tar", "dep:zip"]

[dependencies]
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view" }
eh3d-archive = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/archive" }
eh3d-bungard-formats = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/formats" }
eh3d-fleet = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/fleet" }
eh3d-levelling = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/levelling" }
eh3d-aux = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/auxnode" }
eh3d-inspect = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/inspect" }
eh3d-materials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/materials" }
serde_json = "1"
# the time zone of the system for the hour a job is expected to end at (only its clock, nothing else of the crate)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eh3d-drillpro = { version = ">=0.1.4", path = "../EH3D-DRILLPRO" }
eh3d-routepro = { version = ">=0.1.3", path = "../EH3D-ROUTEPRO" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"], optional = true }
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", default-features = false, optional = true }
# only to know whether the clipboard holds text (the menu of the right button greys Paste out when it does not)
arboard = { version = "3", default-features = false, optional = true }

ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
sha2 = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"], optional = true }

[[bin]]
name = "bungard-gui"
path = "src/bin/bungard_gui.rs"
required-features = ["gui"]

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"

[dev-dependencies]
# the test draws a board and sends it as the camera of the node would
jpeg-encoder = "0.6"

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
