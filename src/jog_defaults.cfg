# The starting values of the panel that moves the machine by hand. The same keys, in the file bungard-gui.jog.cfg next to the settings file of the
# program, take the place of these; a key that is missing or wrong there keeps the value written here. The program also writes there the step, the mode
# and the speed chosen, the zero of the work (origin) and the four places kept (slot1 to slot4, as x, y, z in mm).

# The distances of the step buttons, in mm, from the finest to the coarsest (up to 8, each above 0 and up to 500).
steps = 0.01, 0.1, 1, 10, 50
# The step chosen when the panel opens (one of the list, or the nearest to it), and whether a press of an arrow moves until it is let go.
step = 1
continuous = false

# The three speeds of the moves, in mm per minute, and the one chosen when the panel opens (slow, medium or fast).
speed_slow = 300
speed_medium = 1200
speed_fast = 3000
speed = medium

# While an arrow is held in the continuous mode the head moves in stretches of this length, in mm, one after the other at the pace of the speed.
chunk_mm = 2

# The head moves across the board only when it is at least this far above the surface of the board, in mm; lower than that, Z goes up first.
clearance_mm = 5
# How far below the surface of the board the tool may go by hand, in mm (0 stops it at the surface).
below_board_mm = 0

# Where the panel is, in units of the window (x, y), and whether it is docked at its own place.
panel = 24, 96
dock = false
