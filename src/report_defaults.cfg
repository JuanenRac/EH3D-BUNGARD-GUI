# The figures behind the report of a job (the window of the report and `--report`). The same keys, in the file bungard-gui.report.cfg next to the settings file of the
# program, take the place of these; a key that is missing or wrong there keeps the value written here. The time is an estimate: tune the figures on your machine.

# Seconds a hole takes (the stroke down and up), without the move to it.
drill_cycle_s = 0.8
# The speed of the head between holes and to the start of a path, in mm per second (above 0).
rapid_mm_s = 100
# The speed of the cut along a path, in mm per second (above 0).
route_feed_mm_s = 10
# Seconds each tool takes to be taken from the bar and put back.
tool_change_s = 15
# A job that takes more minutes than this is warned about (0 turns the warning off).
long_job_min = 240
# The gap between two pieces of a panel on the command line, in mm.
panel_gap_mm = 5
